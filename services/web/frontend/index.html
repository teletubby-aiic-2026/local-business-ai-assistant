<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>텔레토비 AI 비서</title>
  <!-- 탭 아이콘: 왼쪽 메뉴 로고와 같은 말풍선 (파일 없이 글자로 넣음) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2303c75a'/%3E%3Cpath transform='translate(6.4 6.4) scale(.8)' fill='%23fff' d='M12 3C6.9 3 3 6.4 3 10.6c0 2.4 1.3 4.6 3.4 6L5.8 20.5l4-2.3c.7.1 1.4.2 2.2.2 5.1 0 9-3.4 9-7.8S17.1 3 12 3z'/%3E%3C/svg%3E">
  <!-- 화면 모양을 첫 그리기 전에 정한다 (깜박임 방지). src/lib/theme.js 와 같은 규칙 -->
  <script>
    (function () {
      try {
        var q = new URLSearchParams(location.search).get("theme");
        var v = q === "light" || q === "dark" ? q : localStorage.getItem("ic26.theme");
        if (v === "light" || v === "dark") document.documentElement.dataset.theme = v;
      } catch (e) { /* 저장소를 못 쓰면 시스템 설정을 따른다 */ }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
