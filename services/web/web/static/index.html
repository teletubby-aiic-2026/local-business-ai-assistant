<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>텔레토비 AI 비서</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- 단계별 화면: 오늘 → 제안 → 초안 → 완료, 그리고 분석 (재정비/05 UI 디자인 레퍼런스 15번) -->
  <header class="top">
    <div class="top-row">
      <a class="brand" href="#/today"><strong>텔레토비 AI 비서</strong></a>
      <span id="store-name" class="small muted"></span>
      <div class="top-right">
        <span id="mode-chip" class="chip"></span>
        <span id="timer" class="timer" title="무엇을 할까요? 버튼부터 재발 방지 공지 승인까지 (C8 KPI)">00:00</span>
      </div>
    </div>
    <nav class="menu" aria-label="단계">
      <a href="#/today" data-route="today"><span class="n">1</span>오늘</a>
      <a href="#/cards" data-route="cards"><span class="n">2</span>제안</a>
      <a href="#/draft" data-route="draft"><span class="n">3</span>초안</a>
      <a href="#/done" data-route="done"><span class="n">4</span>완료</a>
      <a href="#/analysis" data-route="analysis" class="menu-side">분석</a>
    </nav>
  </header>

  <div id="alert" class="alert" role="alert" hidden></div>

  <main>
    <!-- 1 오늘: 숫자 하나 + 핵심 문제 → 무엇을 할까요? -->
    <section class="view narrow" data-view="today">
      <p class="eyebrow"><span class="agent">데이터 분석 비서</span><span>밤 11시 브리핑</span></p>
      <p class="stat"><span id="today-num" class="stat-n">–</span><span id="today-num-label" class="muted">불러오는 중…</span></p>
      <div class="problem">
        <span class="label">오늘의 핵심 문제</span>
        <h1 id="hero-problem" tabindex="-1">오늘 들어온 리뷰를 정리하고 있어요</h1>
      </div>
      <p id="today-source" class="small muted"></p>
      <button id="start" class="primary big" type="button" disabled>불러오는 중…</button>
      <p class="small"><a href="#/analysis">분석 자세히 보기</a></p>
    </section>

    <!-- 2 제안: 카드 2장 중 하나 -->
    <section class="view" data-view="cards" hidden>
      <h1 tabindex="-1">무엇을 할까요?</h1>
      <p class="small muted">어떤 카드를 띄울지는 규칙이 정해요. 하나를 골라 주세요.</p>
      <div id="cards" class="cards"></div>
      <p id="no-card-b" class="small muted"></p>
    </section>

    <!-- 3 초안: 글 하나를 크게, 고치고 승인 -->
    <section class="view narrow" data-view="draft" hidden>
      <div id="draft"></div>
    </section>

    <!-- 4 완료: 승인 결과 + KPI → 처음으로 -->
    <section class="view narrow" data-view="done" hidden>
      <div id="done"></div>
    </section>

    <!-- 분석: 리뷰 묶음·상권 지표·붙여넣기 (예전 ① 브리핑 전체) -->
    <section class="view" data-view="analysis" hidden>
      <h1 tabindex="-1">분석 <span class="agent">데이터 분석 비서</span></h1>
      <p id="analysis-link" class="small"></p>
      <div id="funnel" class="funnel"></div>
      <div class="grid2">
        <div>
          <h2>불만 묶음</h2>
          <div id="groups"></div>
          <details id="singles-box">
            <summary id="singles-title">묶이지 않은 불만</summary>
            <ul id="singles" class="plain"></ul>
          </details>
        </div>
        <div>
          <h2>상권 지표</h2>
          <div id="market"></div>
          <details id="paste-box" class="paste">
            <summary>리뷰 직접 붙여넣기</summary>
            <p class="muted small">배달앱에서 복사한 리뷰를 붙여 넣으면 바로 분류해 묶음에 더해요. 이름·전화번호는 가려서 저장해요.</p>
            <textarea id="paste-text" rows="3" placeholder="예) 반찬이 하나 빠져서 왔어요"></textarea>
            <div class="row">
              <button id="paste-send" type="button">붙여넣기</button>
              <button id="paste-reset" type="button" class="ghost">붙여넣은 리뷰 지우기</button>
            </div>
            <p id="paste-msg" class="small muted"></p>
          </details>
        </div>
      </div>
    </section>
  </main>

  <footer class="foot">
    <span id="foot-msg" class="small muted"></span>
    <details class="honesty-box">
      <summary class="small">동작·모의 표시</summary>
      <div id="honesty" class="honesty" aria-label="동작과 모의 표시"></div>
    </details>
    <button id="record" type="button" class="ghost" hidden>발표 모드로 저장</button>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
