<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>상권 비서 · 서울 상권비서</title>
  <link rel="stylesheet" href="/assistant-assets/assistant.css">
  <script src="/assistant-assets/assistant.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="서울 상권비서 가게 정보 화면으로"><span class="brand-mark" aria-hidden="true">서</span><span>서울 상권비서</span></a>
    <nav class="header-links" aria-label="화면 이동">
      <a href="/">가게·상권 설정</a>
      <span aria-current="page">상권 비서</span>
    </nav>
  </header>

  <main class="chat-shell">
    <section class="chat-column" aria-label="대화">
      <div class="conditions-bar" id="conditions-bar">
        <span class="conditions-label">현재 조건</span>
        <span class="conditions-value" id="conditions-value">아직 정하지 않았어요</span>
        <a class="conditions-edit" href="/">화면에서 바꾸기</a>
      </div>

      <div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions" tabindex="0">
        <div class="welcome" id="welcome">
          <p class="eyebrow">공공 상권 자료로 답해요</p>
          <h1>무엇이든 편하게 물어보세요.</h1>
          <p class="welcome-copy">서울 상권의 매출·점포·유동인구를 서울시 공개 자료로 알려드려요.<br class="mobile-break"> 숫자마다 근거 번호가 붙고, 오른쪽에서 원본을 확인할 수 있어요.</p>
          <div class="starters" id="starters" aria-label="예시 질문">
            <button type="button" class="starter" data-text="합정역 카페 매출 어때?">합정역 카페 매출 어때?</button>
            <button type="button" class="starter" data-text="주말 장사는 어때?">주말 장사는 어때?</button>
            <button type="button" class="starter" data-text="작년이랑 비교하면 손님이 줄었어?">작년이랑 비교하면 손님이 줄었어?</button>
          </div>
        </div>
      </div>

      <div class="typing" id="typing" role="status" hidden>자료를 확인하고 있어요<span class="loading-dots" aria-hidden="true">···</span></div>
      <div class="chat-error" id="chat-error" role="alert" hidden></div>

      <form class="composer" id="composer" novalidate>
        <label class="sr-only" for="message-input">메시지</label>
        <textarea id="message-input" name="text" rows="1" maxlength="1000" placeholder="예: 연남동 카페 주말 매출은?" autocomplete="off"></textarea>
        <button type="submit" class="button button-primary" id="send-button">보내기</button>
      </form>
      <div class="composer-footer">
        <span>Enter 보내기 · Shift+Enter 줄바꿈</span>
        <span class="footer-actions">
          <a class="button-text" id="export-link" href="/api/assistant/conversation.md" download hidden>대화 내보내기(.md)</a>
          <button type="button" class="button-text" id="clear-button">대화 지우기</button>
        </span>
      </div>
    </section>

    <aside class="evidence-column" aria-labelledby="evidence-heading">
      <details class="evidence-panel" id="evidence-panel" open>
        <summary><span id="evidence-heading">근거 자료</span><span class="evidence-count" id="evidence-count"></span></summary>
        <p class="evidence-empty" id="evidence-empty">답변에 사용한 자료가 여기에 표시돼요.</p>
        <ol class="cards" id="cards"></ol>
        <p class="evidence-note">상권 통계는 상권·업종 전체의 추정치이며 개별 가게의 실적이 아니에요.</p>
      </details>
    </aside>
  </main>
</body>
</html>
