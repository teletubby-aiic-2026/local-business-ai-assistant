# 웹 서버 Nginx 설정 (나) 2단계: 웹 서버가 화면 파일을 직접 주고 /api/ 만 WAS(내부 로드 밸런서)로 넘깁니다.
# 프론트엔드(주현석)가 웹 계층에서 작업하게 되면 이 설정으로 바꿉니다 (docs/infra/architecture.md 2절).
#
# 설치: sudo bash deploy/install_web.sh --mode static --lb <내부 로드 밸런서 주소> [--static-src <화면 파일 폴더>]
#   install_web.sh 가 __INTERNAL_LB__ 를 주소로 바꿔 /etc/nginx/sites-available/ic26 에 넣고,
#   화면 파일을 /var/www/ic26/ 에 복사합니다.
#
# 화면 파일 배치 (React + Vite 빌드 services/web/frontend/dist 의 내용. make_bundle.sh 가 묶음 안에서 빌드해 넣음)
#   /var/www/ic26/index.html                 ← GET /            (늘 새로 확인: no-cache)
#   /var/www/ic26/assets/index-<해시>.js·.css ← GET /assets/...  (이름에 내용 해시가 있어 오래 저장해도 됨)
# 즉 dist/ 폴더의 '내용'을 /var/www/ic26/ 에 그대로 복사합니다 (dist/ 폴더 자체를 한 겹 더 넣지 않음).
# 화면은 데이터를 /api/... 로만 부르므로 /api/ 만 WAS 로 넘기면 됩니다.
#
# 이 파일은 Nginx 의 http { } 안에 들어가는 파일입니다 (sites-enabled 또는 conf.d).

map $http_x_forwarded_proto $ic26_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API 문서는 밖에 열지 않습니다. 이 블록이 없으면 아래 location / 의 try_files 가 /docs 에도 index.html 을 줍니다.
    location ~ ^/(docs|redoc|openapi\.json)(/|$) {
        return 404;
    }

    # 빌드 파일. 없는 파일은 index.html 로 돌리지 않고 404 (옛 index.html 이 지워진 파일을 부르는 것을 바로 알 수 있게)
    location /assets/ {
        root /var/www/ic26;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 리뷰 캡처 업로드 (POST /api/care/reviews/capture) 만 12MB 까지 받습니다. Nginx 기본 상한은 1MB 라서 휴대폰 캡처가 여기서 413 이 납니다.
    # 화면 서버의 프록시 상한(12MB)·리뷰 분석 서비스 상한(10MB)과 맞춘 값입니다. 다른 경로의 상한(1MB)은 그대로입니다.
    # client_body_buffer_size 를 같게 두어 올린 이미지를 디스크 임시 파일이 아니라 메모리에서만 다룹니다.
    # 손님용 문의 페이지(/s/)와 /api/care/public/ 은 여기서 따로 열지 않습니다 (화면 서버가 CARE_PUBLIC=1 일 때만 답하고, 기본은 404).
    location = /api/care/reviews/capture {
        client_max_body_size 12m;
        client_body_buffer_size 12m;
        proxy_pass http://__INTERNAL_LB__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ic26_proto;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        # 긴 캡처는 최대 5조각으로 나눠 조각마다 HCX 를 부릅니다 (보통 5~20초, 화면 서버는 100초까지 기다림)
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://__INTERNAL_LB__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ic26_proto;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        # 글 생성이 14초를 넘을 때가 있습니다. 두 로드 밸런서의 유휴 시간 제한도 120초로 맞춥니다 (콘솔에서 설정).
        proxy_read_timeout 120s;
    }

    # 화면. 주소 경로는 #/today 처럼 # 뒤에 있어서 파일이 없는 주소는 index.html 로 돌려도 됩니다.
    location / {
        root /var/www/ic26;
        index index.html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
