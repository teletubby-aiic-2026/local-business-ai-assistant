# 웹 서버 Nginx 설정 (가) 1단계: 모든 요청을 WAS(내부 로드 밸런서)로 넘깁니다.
# 지금 코드는 FastAPI(ic26-was)가 화면 파일까지 주기 때문에 이 설정을 씁니다.
#
# 설치: sudo bash deploy/install_web.sh --mode proxy-all --lb <내부 로드 밸런서 주소>
#   install_web.sh 가 __INTERNAL_LB__ 를 주소로 바꿔 /etc/nginx/sites-available/ic26 에 넣습니다.
#   직접 고쳐 쓸 때는 __INTERNAL_LB__ 를 'ic26-was-alb1 의 접속 주소' 로 바꿉니다 (http:// 와 끝의 / 없이,
#   포트가 80이 아니면 주소:포트).
#
# 이 파일은 Nginx 의 http { } 안에 들어가는 파일입니다 (sites-enabled 또는 conf.d).

# HTTPS 를 공개 로드 밸런서에서 끝낼 때(단계 14) 앞단이 붙인 X-Forwarded-Proto 를 그대로 넘깁니다.
map $http_x_forwarded_proto $ic26_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # 공개 로드 밸런서의 상태 확인. Nginx 가 직접 답합니다 (WAS 가 느려도 웹 서버는 UP 으로 보임).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API 문서는 밖에 열지 않습니다
    location ~ ^/(docs|redoc|openapi\.json)(/|$) {
        return 404;
    }

    location / {
        proxy_pass http://__INTERNAL_LB__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ic26_proto;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        # 글 생성이 14초를 넘을 때가 있습니다. 두 로드 밸런서의 유휴 시간 제한도 120초로 맞춥니다 (콘솔에서 설정).
        proxy_read_timeout 120s;
    }
}
